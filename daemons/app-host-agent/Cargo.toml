[package]
name = "aim-app-host-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The app host's agent in the guest: zygote commands from the system uid, and window input channels"

# Installed as /system_ext/bin/aim-app-host-agent in the app host image
# (docs/app-host.md).
[package.metadata.daemon]
program = "aim-app-host-agent"

[dependencies]
aim-emulated-storage.workspace = true
aim-f2fs.workspace = true
aim-input-transport.workspace = true
aim-meminfo.workspace = true
android_os_vold = { path = "../aidl/android_os_vold" }
binder = { workspace = true, features = ["system"] }
daemon-log.workspace = true
libc.workspace = true
log.workspace = true

# declare_binder_interface! tests the cfgs Soong sets for NDK and VNDK
# builds; a system daemon has neither.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(android_ndk)", "cfg(android_vndk)"]
