[package]
name = "aim-zygote-relay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The native ActivityManager's zygote client: its process starts, sent to zygote with the system uid zygote requires"

# Installed as /system_ext/bin/aim-zygote-relay in the app host image
# (docs/app-host.md).
[package.metadata.daemon]
program = "aim-zygote-relay"

[dependencies]
daemon-log.workspace = true
libc.workspace = true
log.workspace = true
