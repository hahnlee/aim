[package]
name = "vold"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "vold (IVold) for a host directory /data: user storage and the emulated volume"

# Installed as /system/bin/vold, in place of the original.
[package.metadata.daemon]
program = "vold"

[dependencies]
aim-framework-aidl = { path = "../aidl/aim-framework-aidl" }
android_os_vold = { path = "../aidl/android_os_vold" }
binder = { workspace = true, features = ["system"] }
daemon-log.workspace = true
libc.workspace = true
log.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(android_ndk)", "cfg(android_vndk)"]
