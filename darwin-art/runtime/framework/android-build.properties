# OpenGL ES version of the host graphics provider (ANGLE Metal creates ES 3.0
# contexts, not 3.1): 0x30000. PackageManagerService reports it as the
# reqGlEsVersion feature.
ro.opengles.version=196608

# PackageManagerService dexopt compiler filters, verbatim from the pinned
# PS16K image's /system/build.prop.
pm.dexopt.post-boot=verify
pm.dexopt.first-boot=verify
pm.dexopt.boot-after-ota=verify
pm.dexopt.boot-after-mainline-update=verify
pm.dexopt.install=speed-profile
pm.dexopt.install-fast=skip
pm.dexopt.install-bulk=speed-profile
pm.dexopt.install-bulk-secondary=verify
pm.dexopt.install-bulk-downgraded=verify
pm.dexopt.install-bulk-secondary-downgraded=verify
pm.dexopt.bg-dexopt=speed-profile
pm.dexopt.ab-ota=speed-profile
pm.dexopt.inactive=verify
pm.dexopt.cmdline=verify
pm.dexopt.shared=speed

# ART Service dexopt (artd, dex2oat) is off. This runtime's ART executes on
# the host with its own boot image, so dex2oat output compiled for the image's
# boot image would be rejected, as dexpreopt output is (ADR 0009).
dalvik.vm.disable-art-service-dexopt=true
