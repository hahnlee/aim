[package]
license.workspace = true
name = "darwin-binder-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hosts the binder driver core for guest processes in one daemon, over Mach messages (ADR 0012 decision 7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "darwin-binderd"
path = "src/bin/darwin-binderd.rs"

[dependencies]
darwin-binder-driver = { path = "../darwin-binder-driver" }
libc = "0.2"
