[package]
license.workspace = true
name = "darwin-linux-abi"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux arm64 syscall layer that runs original Android ELF programs in-process on Darwin (ADR 0012)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "linux-run"
path = "src/bin/linux-run.rs"

[[bin]]
name = "linux-translate"
path = "src/bin/linux-translate.rs"

[dependencies]
darwin-binder-driver = { path = "../darwin-binder-driver" }
darwin-binder-host = { path = "../darwin-binder-host" }
darwin-host-audio = { path = "../darwin-host-audio" }
darwin-host-display = { path = "../darwin-host-display" }
darwin-host-gpu = { path = "../darwin-host-gpu" }
darwin-host-health = { path = "../darwin-host-health" }
darwin-host-location = { path = "../darwin-host-location" }
darwin-host-sensors = { path = "../darwin-host-sensors" }
darwin-hostcall = { path = "../darwin-hostcall" }
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
darwin-android-image = { path = "../darwin-android-image" }
darwin-android-init = { path = "../darwin-android-init" }
darwin-guest-init = { path = "../darwin-guest-init" }
