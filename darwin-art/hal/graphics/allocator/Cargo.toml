[package]
name = "allocator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "android.hardware.graphics.allocator IAllocator V2 service: memfd-backed graphics buffers (docs/graphics-buffers.md)"

[[bin]]
name = "allocator-service"
path = "src/main.rs"

# Installed as /vendor/bin/hw/<binary> (Cargo target names cannot hold dots).
[package.metadata.vendor-hal]
binary = "android.hardware.graphics.allocator-service.darwin"

[dependencies]
android_hardware_common = { path = "../../aidl/android.hardware.common" }
android_hardware_graphics_allocator = { path = "../../aidl/android.hardware.graphics.allocator" }
android_hardware_graphics_common = { path = "../../aidl/android.hardware.graphics.common" }
binder = { path = "../../binder" }
darwin-gralloc = { path = "../gralloc" }
libc = "0.2"
