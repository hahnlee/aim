[package]
name = "binder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "AOSP libbinder_rs, vendor variant, from the pinned sources"

[lib]
path = "../../_build/vendor-hals/src/frameworks/native/libs/binder/rust/src/lib.rs"

[features]
# The platform variant, for system daemons (`daemons/`).
# AOSP builds libc with extra_traits; system_only.rs compares socket addresses.
system = ["binder_ndk_sys/system", "libc/extra_traits"]

[dependencies]
binder_ndk_sys = { path = "../binder-ndk-sys" }
downcast-rs = "1"
libc = "0.2"
log = "0.4"
zerocopy = { version = "0.8", features = ["alloc"] }

# Upstream code, built as Soong builds it (lints are checked upstream).
[lints.rust]
dead_code = "allow"

[lints.clippy]
all = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(android_vendor)", "cfg(android_ndk)", "cfg(android_vndk)", "cfg(trusty)"]
