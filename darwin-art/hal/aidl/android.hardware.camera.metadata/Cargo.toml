[package]
name = "android_hardware_camera_metadata"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.camera.metadata V1, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../_build/vendor-hals/aidl/android.hardware.camera.metadata-V1/lib.rs"

[dependencies]
async-trait = "0.1"
binder = { path = "../../binder" }
static_assertions = "1"
