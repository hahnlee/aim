# The emulator's vendor HALs. The goldfish/ranchu ones talk to QEMU (pipes,
# virtio consoles, the emulator's host services) and the examples fake
# hardware, neither of which a Mac provides. Their `.rc` and vintf fragment
# go, so the instance is undeclared and the original services take their
# no-HAL paths; a HAL we replace later (composer, audio, camera, bluetooth)
# is added back with its own fragment. The allocator, mapper, GLES driver,
# sensors and GNSS are replaced above. The binaries stay:
# nothing starts them. Kept, being software with no hardware behind it:
# ClearKey DRM, the software KeyMint (with secure clock and shared secret),
# identity credential, and the vendor APEXes authsecret, cas, dumpstate,
# gatekeeper (nonsecure), neuralnetworks (CPU samples), power and widevine.
# The thermal APEX is replaced above.

[[replace]]
path = "/vendor/etc/vintf/manifest.xml"
source = "image/vendor/etc/vintf/manifest.xml"
reason = "drops the HIDL audio.effect@7.0 IEffectsFactory the removed goldfish audio HAL served; a declared HIDL HAL with no server blocks its clients"

[[remove]]
path = "/vendor/etc/init/android.hardware.audio.service.rc"
reason = "goldfish audio (HIDL 7.1 and effects) plays through QEMU's audio device; our CoreAudio audio.core HAL replaces it (P5)"

[[remove]]
path = "/vendor/etc/vintf/manifest/android.hardware.audio@7.1-impl.ranchu.xml"
reason = "declares the removed goldfish audio HAL's IDevicesFactory"

[[remove]]
path = "/vendor/etc/vintf/manifest/bluetooth_audio.xml"
reason = "Bluetooth audio providers live in the removed audio HAL process and need a Bluetooth controller"

[[remove]]
