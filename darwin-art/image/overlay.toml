# The ART exception (ADR 0012 decision 4, docs/art-exception-patches.md):
# macOS maps nothing below 4 GiB, so ART is rebuilt from the pinned sources
# with base-relative 32-bit heap references (patches/art-android/), by
# tools/build-art-android.sh. Every library that links libart's C++
# internals is replaced as a unit; the ones with C APIs stay original.

[[replace]]
path = "/apex/com.android.art/lib64/libart.so"
source = "_build/art-android/stripped/lib64/libart.so"
reason = "the ART exception: heap references are offsets in a window above 4 GiB, since macOS maps nothing below"

[[replace]]
path = "/apex/com.android.art/lib64/libartbase.so"
source = "_build/art-android/stripped/lib64/libartbase.so"
reason = "the ART exception: MemMap's low-4 GiB allocator places mappings in the heap reference window"

[[replace]]
path = "/apex/com.android.art/lib64/libdexfile.so"
source = "_build/art-android/stripped/lib64/libdexfile.so"
reason = "the ART exception: links the C++ internals of the replaced libartbase"

[[replace]]
path = "/apex/com.android.art/lib64/libprofile.so"
source = "_build/art-android/stripped/lib64/libprofile.so"
reason = "the ART exception: links the C++ internals of the replaced libartbase and libdexfile"

[[replace]]
path = "/apex/com.android.art/lib64/libopenjdkjvm.so"
source = "_build/art-android/stripped/lib64/libopenjdkjvm.so"
reason = "the ART exception: the JVM_* interface over the replaced libart's C++ internals"

[[replace]]
path = "/apex/com.android.art/bin/dex2oat64"
source = "_build/art-android/stripped/bin/dex2oat64"
reason = "the ART exception: compiles for the replaced libart's reference encoding and Thread layout"

