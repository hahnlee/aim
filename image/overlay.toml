# Derived system image overlay (docs/adr/0012-original-android-userspace.md,
# "Derived system image").
#
# The derived image is the extracted original Android image plus exactly the
# entries below. This file is the complete list of where we deviate from the
# original; `android-image diff` prints it with sizes and reasons.
#
# Policy
# - Prefer additions. We run the original userspace; our own pieces are added
#   beside it, never patched into it.
# - Our device's vendor partition lives under /vendor, as a device vendor's
#   would: our HALs, the vintf manifest and the GPU libraries. Hardware the
#   device does not have is not declared, so the original services take their
#   no-HAL paths.
# - Replacing or removing an original file is an exception. Each one is listed
#   explicitly with a `reason` that says why no addition can do the job.
#
# Schema 1 (a strict subset of TOML; anything else is rejected)
#
#   [[add]]                     a file the original does not have
#   path = "/vendor/..."        absolute guest path
#   source = "target/aim/..."   file relative to the repo root: checked in, or
#                               a `cargo aim` output (docs/build.md), whose
#                               node the derived image then depends on
#   reason = "..."              optional
#
#   [[replace]]                 a file the original has; `reason` required
#   path, source, reason
#
#   [[remove]]                  a file or directory the original has;
#   path, reason                `reason` required
#
# Rules: guest paths are absolute and normalized, and may not pass through a
# symlink in the original; `add` may not shadow an original path (use
# `replace`); every source must exist; no path may be declared twice or
# inside another declared path.
#
# The derived identity is sha256 of the original's identity, this manifest in
# canonical form and the sha256 of every source; comments, formatting and
# entry order do not affect it.

schema = 1

# The device: `aim` (androidboot.hardware=aim, from aim-guest-init),
# so init.rc imports init.aim.rc and vold reads fstab.aim. The
# emulator's device files and helpers go: they set up QEMU's virtual
# hardware, which a Mac does not have.

[[add]]
path = "/vendor/etc/init/hw/init.aim.rc"
source = "image/vendor/etc/init/hw/init.aim.rc"
reason = "the device's init script: ro.hardware.egl and .vulkan, GLES version, density and mount_all"

[[add]]
path = "/vendor/etc/fstab.aim"
source = "image/vendor/etc/fstab.aim"
reason = "the device's fstab for mount_all and vold: /data without file-based encryption"

[[remove]]
path = "/vendor/etc/init/hw/init.ranchu.rc"
reason = "the emulator's device script (QEMU props, kernel modules, zram, virtio Wi-Fi); init.aim.rc replaces it"

[[remove]]
path = "/vendor/etc/fstab.ranchu"
reason = "the emulator's virtio block devices; fstab.aim replaces it"

[[remove]]
path = "/vendor/bin/qemu-props"
reason = "sets properties it reads from the emulator over the QEMU pipe"

[[remove]]
path = "/vendor/bin/dlkm_loader"
reason = "loads the emulator's kernel modules; there is no Linux kernel"

[[remove]]
path = "/vendor/lib/modules"
reason = "the emulator's Linux kernel modules (virtio, goldfish, mac80211)"

[[remove]]
path = "/vendor/bin/init.ranchu-core.sh"
reason = "holds a wake lock unless a QEMU boot option allows suspend"

[[remove]]
path = "/vendor/bin/init.ranchu-net.sh"
reason = "creates the emulator's virtio Wi-Fi radio and its inter-emulator interface"

[[remove]]
path = "/vendor/bin/mac80211_create_radios"
reason = "creates mac80211_hwsim radios for the emulator's virtual Wi-Fi"

[[remove]]
path = "/vendor/bin/init_ranchu_device_state.sh"
reason = "writes the emulator's device-state config from a QEMU boot option"

[[remove]]
path = "/vendor/bin/bt_vhci_forwarder"
reason = "forwards HCI between QEMU's virtio console and /dev/vhci"

[[remove]]
path = "/system_ext/bin/init.ranchu.adb.setup.sh"
reason = "writes adb_keys from the emulator host's key, a QEMU boot option"

[[remove]]
path = "/system_ext/etc/init/init.system_ext.rc"
reason = "only reacts to the removed ranchu-adb-setup and qemu-device-state services"

