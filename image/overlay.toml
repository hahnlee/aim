# Replaced native daemons (ADR 0012 appendix): Rust programs that serve the
# platform's own binder interfaces in place of daemons bound to Linux kernel
# features, built by the daemon/* nodes of `cargo aim` from daemons/. The
# original init .rc files still start them.

[[replace]]
path = "/system/bin/apexd"
source = "target/aim/daemons/bin/apexd"
reason = "APEXes are pre-flattened into the derived image (no loop devices or dm-verity); this apexd only serves apexservice from the APEX info list"

[[replace]]
path = "/system/bin/vold"
source = "target/aim/daemons/bin/vold"
reason = "vold drives block devices, dm-crypt, fscrypt and mounts; /data is a host directory, so this IVold prepares user storage as directories and links the emulated volume to /data/media"

[[replace]]
path = "/system/bin/netd"
source = "target/aim/daemons/bin/netd"
reason = "netd drives netlink, iptables, policy routing and eBPF; guest sockets are host sockets, so this INetd keeps the network bookkeeping, answers fwmarkd and hosts the original DnsResolver"

[[replace]]
path = "/system/bin/lmkd"
source = "target/aim/daemons/bin/lmkd"
reason = "lmkd kills by PSI and memcg pressure, which Darwin does not report; this lmkd keeps the control protocol and kill order and kills on the Mac's memory pressure, from the host-call module memory (#222, #277)"
