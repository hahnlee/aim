# One workspace for the host (macOS) crates and the guest crates built for
# aarch64-linux-android (hal/, daemons/). `cargo aim` (crates/aim-build,
# docs/build.md) builds both; plain `cargo build`/`cargo test` build the
# host crates (default-members).
#
# The AIDL and AOSP sources of the guest crates and of aim-services are not
# in Git: the aidl-gen node of `cargo aim` fetches the pinned AOSP sources
# into _build/aosp and generates the AIDL crates into target/aim/gen before
# cargo runs.
[workspace]
members = [
    "crates/aim-android-image",
    "crates/aim-android-init",
    "crates/aim-apps",
    "crates/aim-guest-init",
    "crates/aim-binder-driver",
    "crates/aim-binder-host",
    "crates/aim-build",
    "crates/aim-host-audio",
    "crates/aim-host-bluetooth",
    "crates/aim-host-camera",
    "crates/aim-host-display",
    "crates/aim-host-gpu",
    "crates/aim-host-health",
    "crates/aim-host-location",
    "crates/aim-host-memory",
    "crates/aim-host-sensors",
    "crates/aim-host-vulkan",
    "crates/aim-hostcall",
    "crates/aim-linux-abi",
    "crates/aim-paths",
    "crates/aim-services",
    "crates/aim-services/aidl",
    "crates/aim-storage",
    "crates/aim-sync-file",
    "crates/aimctl",
    "tools/android-image-extract",
    # Guest (aarch64-linux-android).
    "hal/aidl/*",
    "hal/audio",
    "hal/audio/check",
    "hal/binder",
    "hal/binder-ndk-sys",
    "hal/bluetooth",
    "hal/camera",
    "hal/fmq",
    "hal/graphics/allocator",
    "hal/graphics/composer",
    "hal/graphics/gralloc",
    "hal/graphics/mapper",
    "hal/gles",
    "hal/gnss",
    "hal/health",
    "hal/sensors",
    "hal/vulkan",
    "hal/tests/bluetooth-hci-client",
    "hal/tests/camera-client",
    "daemons/aidl/*",
    "daemons/apexd",
    "daemons/keyboard",
    "daemons/lmkd",
    "daemons/lmkd/core",
    "daemons/log",
    "daemons/netd",
    "daemons/vold",
    "daemons/windows",
    "daemons/windows/core",
]
default-members = [
    "crates/aim-android-image",
    "crates/aim-android-init",
    "crates/aim-apps",
    "crates/aim-guest-init",
    "crates/aim-binder-driver",
    "crates/aim-binder-host",
    "crates/aim-build",
    "crates/aim-host-audio",
    "crates/aim-host-bluetooth",
    "crates/aim-host-camera",
    "crates/aim-host-display",
    "crates/aim-host-gpu",
    "crates/aim-host-health",
    "crates/aim-host-location",
    "crates/aim-host-memory",
    "crates/aim-host-sensors",
    "crates/aim-host-vulkan",
    "crates/aim-hostcall",
    "crates/aim-linux-abi",
    "crates/aim-paths",
    "crates/aim-services",
    "crates/aim-services/aidl",
    "crates/aim-storage",
    "crates/aim-sync-file",
    "crates/aimctl",
    "tools/android-image-extract",
    # lmkd's policy and the task bridge's parcel reading, guest libraries,
    # are built for the host too to run their tests.
    "daemons/lmkd/core",
    "daemons/windows/core",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
aim-hostcall = { path = "crates/aim-hostcall" }
aim-paths = { path = "crates/aim-paths" }
aim-storage = { path = "crates/aim-storage" }
aim-sync-file = { path = "crates/aim-sync-file" }
async-trait = "0.1"
# AOSP libbinder_rs, vendor variant; the daemons add the `system` feature.
binder = { path = "hal/binder" }
daemon-log = { path = "daemons/log" }
libc = "0.2"
log = "0.4"
sha2 = "0.10"
static_assertions = "1"

# The host crates: incremental, so a branch switch recompiles only what
# changed in a crate (docs/build.md, "Rebuild times"). The codegen units
# are release's default without incremental, not incremental's 256, which
# would split linux-run's hot paths further.
[profile.release]
incremental = true
codegen-units = 16

# The guest crates are built with this profile (`cargo aim`), as Soong
# builds them: LTO (which rules out incremental), one codegen unit, no
# debug info.
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
incremental = false
strip = "debuginfo"
