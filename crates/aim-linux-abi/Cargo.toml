[package]
license.workspace = true
name = "aim-linux-abi"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux arm64 syscall layer that runs original Android ELF programs in-process on Darwin (ADR 0012)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "linux-run"
path = "src/bin/linux-run.rs"

[[bin]]
name = "linux-translate"
path = "src/bin/linux-translate.rs"

[dependencies]
aim-ashmem = { path = "../aim-ashmem" }
aim-binder-driver = { path = "../aim-binder-driver" }
aim-binder-host = { path = "../aim-binder-host" }
aim-host-audio = { path = "../aim-host-audio" }
aim-host-bluetooth = { path = "../aim-host-bluetooth" }
aim-host-camera = { path = "../aim-host-camera" }
aim-host-display = { path = "../aim-host-display" }
aim-host-gpu = { path = "../aim-host-gpu" }
aim-host-health = { path = "../aim-host-health" }
aim-host-location = { path = "../aim-host-location" }
aim-host-memory = { path = "../aim-host-memory" }
aim-host-sensors = { path = "../aim-host-sensors" }
aim-host-vulkan = { path = "../aim-host-vulkan" }
aim-hostcall.workspace = true
aim-sync-file.workspace = true
aim-storage.workspace = true
libc.workspace = true
sha2.workspace = true

[dev-dependencies]
aim-android-image = { path = "../aim-android-image" }
aim-android-init = { path = "../aim-android-init" }
aim-guest-init = { path = "../aim-guest-init" }
aim-paths.workspace = true
