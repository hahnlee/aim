[package]
license.workspace = true
name = "aim-android-image"
version = "0.1.0"
edition = "2024"
publish = false
description = "Derives the system image from the original Android image and a checked-in overlay manifest"

[[bin]]
name = "android-image"
path = "src/main.rs"

[dependencies]
adler2 = "2"
crc32fast = "1"
libc.workspace = true
sha1 = "0.10"
sha2.workspace = true

[dev-dependencies]
aim-paths.workspace = true
