[package]
license.workspace = true
name = "aim-services"
version = "0.1.0"
edition = "2024"
publish = false
description = "Android's system services as native macOS implementations, served on the host's binder (ADR 0013)"

[dependencies]
aim-android-xml = { path = "../aim-android-xml" }
aim-apps = { path = "../aim-apps" }
aim-binder-driver = { path = "../aim-binder-driver" }
aim-binder-host = { path = "../aim-binder-host" }
aim-host-audio = { path = "../aim-host-audio" }
aim-host-display = { path = "../aim-host-display" }
aim-host-location = { path = "../aim-host-location" }
aim-host-sensors = { path = "../aim-host-sensors" }
aim-hostcall.workspace = true
aim-service-aidl = { path = "aidl" }
aim-storage.workspace = true
android-image-extract = { path = "../../tools/android-image-extract" }
dsa = "0.6"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
libc.workspace = true
md-5 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }

[dev-dependencies]
aim-paths.workspace = true
aim-android-image = { path = "../aim-android-image" }
