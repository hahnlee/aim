[package]
license.workspace = true
name = "aim-guest-init"
version = "0.1.0"
edition = "2024"
publish = false
description = "aimd's init role: boots the original Android userspace of a derived image on the Linux syscall layer (ADR 0012 item 6)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "guest-init"
path = "src/bin/guest-init.rs"

[dependencies]
aim-android-init = { path = "../aim-android-init" }
aim-binder-host = { path = "../aim-binder-host" }
aim-storage.workspace = true
libc.workspace = true

[dev-dependencies]
aim-paths.workspace = true
