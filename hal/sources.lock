# Pinned inputs of the guest crates (hal/): the aidl-gen node of `cargo aim`
# (docs/build.md) reads them. Shell-style assignments.
#
# Trees come from android.googlesource.com at AOSP_TAG, the tag of the pinned
# image. Source trees are checked against a content hash: sha256 over the
# `shasum -a 256` lines of every file, sorted by path. Frozen AIDL APIs are
# checked against their own `.hash`, recomputed the way Soong freezes them.
AOSP_TAG=android-16.0.0_r1

# project|subtree|content sha256
SOURCE_TREES=(
  "platform/frameworks/native|libs/binder/rust|b7dbab7e663501608afbf44c1392e79307a6e1138d63bb73de02e2fafeda722c"
  "platform/frameworks/native|libs/binder/ndk/include_ndk|a699a8ecc88410695a1d6408598b864c70f2d8772f0b7fdfeeda52a985a815ef"
  "platform/frameworks/native|libs/binder/ndk/include_platform|2e54aeebc4060d2083f79401cffbda6ed6574aadaa6e345d9cefbbe8a34b4bdd"
)

# The SDK aidl compiler (build-tools 36.0.0, macOS), relative to the SDK.
AIDL_COMPILER=build-tools/36.0.0/aidl
AIDL_COMPILER_SHA256=c422770a410e509659423b290aedd5ea8997c04033df3db2b86d9d6cd1688da3

# Stable AIDL interfaces, one frozen version each:
#   package|version|project|aidl_api directory|imports
# Imports are the `versions_with_info` imports of that version in the
# interface's Android.bp, as package-V<version>; each must be listed here at
# that version. A service's crate depends on the crates of its interfaces;
# an interface's crate depends on the crates of its imports.
hw=platform/hardware/interfaces
sys=platform/system/hardware/interfaces
AIDL_INTERFACES=(
  "android.hardware.common|2|$hw|common/aidl/aidl_api/android.hardware.common/2|"
  "android.hardware.common.fmq|1|$hw|common/fmq/aidl/aidl_api/android.hardware.common.fmq/1|android.hardware.common-V2"
  "android.hardware.drm.common|1|$hw|drm/common/aidl/aidl_api/android.hardware.drm.common/1|"
  "android.hardware.graphics.common|6|$hw|graphics/common/aidl/aidl_api/android.hardware.graphics.common/6|android.hardware.common-V2"
  "android.hardware.graphics.allocator|2|$hw|graphics/allocator/aidl/aidl_api/android.hardware.graphics.allocator/2|android.hardware.common-V2,android.hardware.graphics.common-V6"
  "android.hardware.graphics.composer3|4|$hw|graphics/composer/aidl/aidl_api/android.hardware.graphics.composer3/4|android.hardware.graphics.common-V6,android.hardware.common-V2,android.hardware.drm.common-V1"
  "android.hardware.power|6|$hw|power/aidl/aidl_api/android.hardware.power/6|android.hardware.common.fmq-V1,android.hardware.common-V2"
  "android.hardware.health|4|$hw|health/aidl/aidl_api/android.hardware.health/4|"
  "android.hardware.sensors|3|$hw|sensors/aidl/aidl_api/android.hardware.sensors/3|android.hardware.common-V2,android.hardware.common.fmq-V1"
  "android.hardware.bluetooth|1|$hw|bluetooth/aidl/aidl_api/android.hardware.bluetooth/1|"
  "android.hardware.gnss|2|$hw|gnss/aidl/aidl_api/android.hardware.gnss/2|"
  "android.hardware.camera.common|1|$hw|camera/common/aidl/aidl_api/android.hardware.camera.common/1|"
  "android.hardware.camera.metadata|1|$hw|camera/metadata/aidl/aidl_api/android.hardware.camera.metadata/1|"
  "android.hardware.camera.device|1|$hw|camera/device/aidl/aidl_api/android.hardware.camera.device/1|android.hardware.common-V2,android.hardware.common.fmq-V1,android.hardware.camera.common-V1,android.hardware.camera.metadata-V1,android.hardware.graphics.common-V6"
  "android.hardware.camera.provider|1|$hw|camera/provider/aidl/aidl_api/android.hardware.camera.provider/1|android.hardware.camera.device-V1,android.hardware.camera.common-V1"
  "android.media.audio.common.types|4|$sys|media/aidl_api/android.media.audio.common.types/4|"
  "android.media.audio.eraser.types|1|$sys|media/aidl_api/android.media.audio.eraser.types/1|android.media.audio.common.types-V4"
  "android.hardware.audio.common|4|$hw|audio/aidl/aidl_api/android.hardware.audio.common/4|android.media.audio.common.types-V4"
  "android.hardware.audio.core.sounddose|3|$hw|audio/aidl/aidl_api/android.hardware.audio.core.sounddose/3|android.media.audio.common.types-V4"
  "android.hardware.audio.effect|3|$hw|audio/aidl/aidl_api/android.hardware.audio.effect/3|android.media.audio.eraser.types-V1,android.media.audio.common.types-V4,android.hardware.audio.common-V4,android.hardware.common-V2,android.hardware.common.fmq-V1"
  "android.hardware.audio.core|3|$hw|audio/aidl/aidl_api/android.hardware.audio.core/3|android.media.audio.common.types-V4,android.hardware.audio.effect-V3,android.hardware.audio.core.sounddose-V3,android.hardware.audio.common-V4,android.hardware.common-V2,android.hardware.common.fmq-V1"
)
unset hw sys
