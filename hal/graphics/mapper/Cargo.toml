[package]
name = "mapper"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Stable-C IMapper v5 of the derived image (docs/graphics-buffers.md), loaded in-process by libui"

[lib]
crate-type = ["cdylib"]

# Installed as /vendor/lib64/hw/<library>, the name libui's Gralloc5 loads
# for the allocator's suffix.
[package.metadata.vendor-hal]
library = "mapper.aim.so"

[dependencies]
aim-gralloc = { path = "../gralloc" }
libc.workspace = true
