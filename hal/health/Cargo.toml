[package]
name = "health"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "android.hardware.health IHealth V4 service over the Mac's battery (host module `health`)"

[[bin]]
name = "health-service"
path = "src/main.rs"

# Installed as /vendor/bin/hw/<binary> (Cargo target names cannot hold dots).
[package.metadata.vendor-hal]
binary = "android.hardware.health-service.aim"

[dependencies]
android_hardware_health = { path = "../aidl/android.hardware.health" }
binder.workspace = true
aim-hostcall.workspace = true
log.workspace = true
