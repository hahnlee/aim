[package]
name = "android_hardware_graphics_composer3"
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.graphics.composer3 V4, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../_build/vendor-hals/aidl/android.hardware.graphics.composer3-V4/lib.rs"

[dependencies]
android_hardware_common = { path = "../android.hardware.common" }
android_hardware_drm_common = { path = "../android.hardware.drm.common" }
android_hardware_graphics_common = { path = "../android.hardware.graphics.common" }
async-trait = "0.1"
binder = { path = "../../binder" }
static_assertions = "1"
