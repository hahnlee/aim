[package]
name = "android_hardware_audio_effect"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.audio.effect V3, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../target/aim/gen/hal-aidl/android.hardware.audio.effect-V3/lib.rs"

[dependencies]
android_hardware_audio_common = { path = "../android.hardware.audio.common" }
android_hardware_common = { path = "../android.hardware.common" }
android_hardware_common_fmq = { path = "../android.hardware.common.fmq" }
android_media_audio_common_types = { path = "../android.media.audio.common.types" }
android_media_audio_eraser_types = { path = "../android.media.audio.eraser.types" }
async-trait.workspace = true
binder.workspace = true
static_assertions.workspace = true
