[package]
name = "android_hardware_thermal"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.thermal V3, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../target/aim/gen/hal-aidl/android.hardware.thermal-V3/lib.rs"

[dependencies]
async-trait.workspace = true
binder.workspace = true
static_assertions.workspace = true
