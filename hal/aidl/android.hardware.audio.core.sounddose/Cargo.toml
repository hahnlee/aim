[package]
name = "android_hardware_audio_core_sounddose"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.audio.core.sounddose V3, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../target/aim/gen/hal-aidl/android.hardware.audio.core.sounddose-V3/lib.rs"

[dependencies]
android_media_audio_common_types = { path = "../android.media.audio.common.types" }
async-trait.workspace = true
binder.workspace = true
static_assertions.workspace = true
