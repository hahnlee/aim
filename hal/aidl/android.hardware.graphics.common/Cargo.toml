[package]
name = "android_hardware_graphics_common"
version = "6.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "android.hardware.graphics.common V6, Rust backend, generated from the frozen AIDL API"
# The binder macros expand here, so this crate needs the vendor cfgs too.
build = "../../binder/build.rs"

[lib]
path = "../../../target/aim/gen/hal-aidl/android.hardware.graphics.common-V6/lib.rs"

[dependencies]
android_hardware_common = { path = "../android.hardware.common" }
async-trait.workspace = true
binder.workspace = true
static_assertions.workspace = true
