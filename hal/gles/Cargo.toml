[package]
name = "gles"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The derived image's GLES driver: EGL and OpenGL ES forwarded to the host's ANGLE over host-call (docs/gles-driver.md)"

[lib]
crate-type = ["cdylib"]

# Installed as /vendor/lib64/egl/<library>; the original libEGL loads it for
# ro.hardware.egl=aim.
[package.metadata.vendor-hal]
library = "libGLES_aim.so"

[build-dependencies]
aim-paths.workspace = true

[dependencies]
aim-gralloc = { path = "../graphics/gralloc" }
aim-hostcall.workspace = true
libc.workspace = true
