[package]
name = "gnss"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "android.hardware.gnss IGnss V2 service over CoreLocation (host module `location`)"

[[bin]]
name = "gnss-service"
path = "src/main.rs"

# Installed as /vendor/bin/hw/<binary> (Cargo target names cannot hold dots).
[package.metadata.vendor-hal]
binary = "android.hardware.gnss-service.aim"

[dependencies]
android_hardware_gnss = { path = "../aidl/android.hardware.gnss" }
binder.workspace = true
aim-hostcall.workspace = true
libc.workspace = true
log.workspace = true
