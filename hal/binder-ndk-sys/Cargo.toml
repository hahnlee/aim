[package]
name = "binder_ndk_sys"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "AOSP libbinder_ndk_sys (vendor variant): bindgen bindings to the image's libbinder_ndk.so"
links = "binder_ndk"

[lib]
# The fetched crate root, copied by aidl-gen so formatting stays out of
# _build (crates/aim-build/src/nodes/aidl.rs).
path = "../../target/aim/gen/binder-root/binder_ndk_sys/lib.rs"

[dependencies]
libc.workspace = true

[features]
# The platform variant (no vendor defines), for system daemons.
system = []

[build-dependencies]
aim-paths.workspace = true
bindgen = "0.70"
