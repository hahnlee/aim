<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E2E-WAIT</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px sans-serif; background: #fff3bf; }
  h1 { height: 52px; margin: 0; padding: 12px; font-size: 22px; }
  .control { position: absolute; left: 12px; right: 12px; height: 48px;
    border: 2px solid #333; border-radius: 8px; background: white;
    font: inherit; text-align: center; }
  #typing { top: 60px; padding: 8px; }
  #play { top: 120px; }
  #download { top: 180px; padding: 10px; color: #111; text-decoration: none; }
  #pick { top: 240px; padding: 10px; overflow: hidden; }
  #pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  #webgl { top: 300px; padding: 10px; color: #111; text-decoration: none; }
  #status { position: absolute; top: 362px; left: 12px; right: 12px;
    white-space: pre-wrap; font: 14px monospace; }
  video { position: absolute; left: 12px; top: 450px; width: 160px; height: 90px; }
</style>
<h1>aim Chromium E2E</h1>
<input id="typing" class="control" autocomplete="off" placeholder="physical keyboard: hello">
<button id="play" class="control">PLAY VIDEO + AUDIO</button>
<a id="download" class="control" href="upload-fixture.txt" download="downloaded-fixture.txt">DOWNLOAD</a>
<label id="pick" class="control">PICK HOST FILE<input id="file" type="file"></label>
<a id="webgl" class="control" href="webgl.html" target="_blank" rel="noopener">OPEN WEBGL TAB</a>
<div id="status">waiting</div>
<video id="video" playsinline src="media.webm"></video>
<script>
const expected = 'aim-file-bridge-ok';
const state = { pointer: false, keyboard: false, download: false, file: false,
  media: false };
const status = document.querySelector('#status');
const video = document.querySelector('#video');
const reported = new Set();
function report(name) {
  if (reported.has(name)) return;
  reported.add(name);
  fetch(`/report?case=${encodeURIComponent(name)}&status=pass`, {cache: 'no-store'});
}
function render() {
  status.textContent = Object.entries(state).map(([k, v]) => `${k}=${v}`).join('\n');
  for (const name of ['pointer', 'keyboard', 'download', 'file', 'media']) {
    if (state[name]) report(name);
  }
  if (state.pointer && state.keyboard && state.download && state.file && state.media) {
    document.title = 'E2E-PASS';
    document.body.style.background = '#55dd77';
    report('e2e');
  }
}
document.body.addEventListener('pointerdown', event => {
  report(`pointer-${event.target.id || event.target.tagName}-${Math.round(event.clientX)}-${Math.round(event.clientY)}`);
  state.pointer = true;
  render();
});
document.querySelector('#typing').addEventListener('input', event => {
  state.keyboard = event.target.value === 'hello'; render();
});
document.querySelector('#typing').addEventListener('keydown', event => {
  report(`keydown-${event.key}-${event.code}-${event.keyCode}`);
});
document.querySelector('#download').addEventListener('click', () => {
  state.download = true; render();
});
document.querySelector('#file').addEventListener('change', async event => {
  const file = event.target.files[0];
  state.file = !!file && (await file.text()).trim() === expected;
  render();
});
document.querySelector('#play').addEventListener('click', async () => {
  try { await video.play(); } catch (error) { status.textContent = String(error); }
});
setInterval(() => {
  state.media ||= video.currentTime > 0.6 && !video.paused;
  render();
}, 200);
render();
</script>
