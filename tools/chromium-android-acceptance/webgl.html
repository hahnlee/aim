<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEBGL-WAIT</title>
<style>body{font:18px sans-serif;background:#f99}canvas{border:2px solid #333}</style>
<h1>WebGL bridge</h1><canvas width="160" height="160"></canvas><pre></pre>
<script>
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
let pass = false;
let detail = 'context=null';
if (gl) {
  gl.clearColor(0.1, 0.8, 0.25, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const pixel = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  pass = pixel[1] > 150 && pixel[3] === 255;
  detail = `${gl.constructor.name} ${gl.getParameter(gl.VERSION)} pixel=${pixel}`;
}
document.querySelector('pre').textContent = detail;
document.title = pass ? 'WEBGL-PASS' : 'WEBGL-FAIL';
document.body.style.background = pass ? '#55dd77' : '#f99';
fetch(`/report?case=webgl&status=${pass ? 'pass' : 'fail'}&detail=${encodeURIComponent(detail)}`,
      {cache: 'no-store'});
</script>
